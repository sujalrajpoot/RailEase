<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailEase - Book train tickets</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply saved theme before first paint (no flash). Falls back to the OS preference.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t) { t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; localStorage.setItem("theme", t); }
          document.documentElement.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
